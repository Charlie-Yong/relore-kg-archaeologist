name: Planning checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  planning:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Check planning-tool regressions
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Check planning documents
        run: python tools/check_planning.py
