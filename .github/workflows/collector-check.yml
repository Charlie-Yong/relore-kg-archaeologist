name: Collector checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: collector
          POSTGRES_PASSWORD: collector_dev
          POSTGRES_DB: collector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector -d collector_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      RELORE_TEST_POSTGRES_URL: postgresql://collector:collector_dev@127.0.0.1:5432/collector_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install bundled source and locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Check project collector
        run: |
          python -m ruff check historykg tests tools/run_collector_smoke.py
          python -m pytest tests -q
      - name: Check bundled relore against SQLite and PostgreSQL
        working-directory: vendor/relore
        run: python -m pytest tests -q
