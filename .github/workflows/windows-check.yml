name: Windows rebuild checks

on:
  pull_request:
  push:
    branches: [main, feat/p1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      RELORE_TEST_POSTGRES_URL: postgresql://collector@127.0.0.1:16432/collector_test
      P2_TEST_DATABASE_URL: postgresql://collector@127.0.0.1:16432/collector_test
      P2_TEST_NEO4J_URI: bolt://127.0.0.1:17687
      HISTORYKG_PLATFORM_DATABASE_URL: postgresql://collector@127.0.0.1:16432/historykg_windows
      HISTORYKG_NEO4J_URI: bolt://127.0.0.1:17687
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the locked project and bundled relore
        run: python -m pip install -r requirements.txt
      - name: Start PostgreSQL 16.4 and Neo4j 5.26.0 on loopback
        shell: pwsh
        run: ./tools/ci/start_windows_services.ps1
      - name: Check source, contracts, actual databases, UI and job recovery
        run: |
          python -m pip check
          python -m ruff check historykg app tests tools/run_platform_rebuild.py
          python -m pytest tests -q --junitxml=.local/windows-validation/tests.xml
          python tools/check_planning.py
      - name: Rebuild the public synthetic fixture against both services
        run: python tools/run_platform_rebuild.py --dataset fixtures/toy_v1 --out .local/windows-validation/toy.json
      - name: Unpack the frozen public Flask sources and graph
        run: python -m tarfile -e repro/flask_frozen.tar.gz .local/frozen
      - name: Rebuild the real frozen Flask graph without external model calls
        run: python tools/run_platform_rebuild.py --dataset .local/frozen/flask --out .local/windows-validation/flask.json --question "stream context"
      - name: Upload the exact verification record and service logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-verification
          path: |
            .local/windows-validation/
          if-no-files-found: error
